<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="diagram-pipeline-overview-title diagram-pipeline-overview-desc">
<title id="diagram-pipeline-overview-title">Pipeline: from task to evidence</title>
<desc id="diagram-pipeline-overview-desc">Pipeline overview. A task and a versioned prompt feed a bounded agent that uses run_checks. Its final submission goes to hidden grading on the host, which writes a local run bundle first. From the bundle the evidence is recorded in MLflow, regraded by grading replay, and used for the baseline versus revised comparison. CI runs alongside on fixtures and probes with no model API.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="40" y="34" font-size="26" font-weight="bold" fill="#1a1a1a">Pipeline: from task to evidence</text><rect x="40" y="70" width="210" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="145" y="109" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Task + prompt</text><text x="145" y="142" font-size="20" text-anchor="middle" fill="#4d4d4d">frozen, versioned</text><rect x="375" y="70" width="210" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="480" y="109" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Bounded agent</text><text x="480" y="142" font-size="20" text-anchor="middle" fill="#4d4d4d">model + run_checks</text><rect x="710" y="70" width="210" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="815" y="109" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Hidden grading</text><text x="815" y="142" font-size="20" text-anchor="middle" fill="#4d4d4d">on the host</text><rect x="355" y="230" width="250" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="480" y="269" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Local run bundle</text><text x="480" y="302" font-size="20" text-anchor="middle" fill="#4d4d4d">written first</text><rect x="40" y="390" width="250" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="165" y="429" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">MLflow record</text><text x="165" y="462" font-size="20" text-anchor="middle" fill="#4d4d4d">after the bundle</text><rect x="355" y="390" width="250" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="480" y="429" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Grading replay</text><text x="480" y="462" font-size="20" text-anchor="middle" fill="#4d4d4d">regrades saved finals</text><rect x="670" y="390" width="250" height="90" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="795" y="429" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Comparison</text><text x="795" y="462" font-size="20" text-anchor="middle" fill="#4d4d4d">baseline vs revised</text><path d="M250 115H359" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M373 115L359 108L359 122Z" fill="#1a1a1a" stroke="none"/><text x="647" y="96" font-size="20" text-anchor="middle" fill="#1a1a1a">final</text><text x="647" y="118" font-size="20" text-anchor="middle" fill="#1a1a1a">submission</text><path d="M585 135H694" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M708 135L694 128L694 142Z" fill="#1a1a1a" stroke="none"/><path d="M815 160V195H480V216" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M480 228L473 214L487 214Z" fill="#1a1a1a" stroke="none"/><text x="660" y="186" font-size="20" text-anchor="middle" fill="#1a1a1a">grades</text><path d="M480 320V355H165V376" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M165 388L158 374L172 374Z" fill="#1a1a1a" stroke="none"/><text x="178" y="380" font-size="20" fill="#1a1a1a">record</text><path d="M480 320V376" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M480 388L473 374L487 374Z" fill="#1a1a1a" stroke="none"/><text x="560" y="345" font-size="20" fill="#1a1a1a">re-grade</text><path d="M480 320V355H795V376" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M795 388L788 374L802 374Z" fill="#1a1a1a" stroke="none"/><text x="782" y="380" font-size="20" text-anchor="end" fill="#1a1a1a">compare</text><rect x="40" y="494" width="880" height="36" rx="8" fill="#f4f4f4" stroke="#4d4d4d" stroke-width="3" stroke-dasharray="8 6"/><text x="480" y="519" font-size="20" text-anchor="middle" fill="#1a1a1a">CI: tests and probes on fixtures, no model API</text>
</svg>
