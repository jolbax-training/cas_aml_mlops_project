<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="diagram-trust-boundary-title diagram-trust-boundary-desc">
<title id="diagram-trust-boundary-title">Trust boundary: host and per-check container</title>
<desc id="diagram-trust-boundary-desc">Trust boundary. On the trusted host, a launcher starts one container per check; hidden answers and scoring and the API key and ledger stay on the host. Into the per-check container go only the candidate code and one case, received by the supervisor; out to the launcher comes one bounded result written by the supervisor, which checked the executor's signed report inside the container. Never inside the container: answers, credentials, repository files, network, MLflow, Podman control.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}</style>
<rect x="0" y="0" width="960" height="540" fill="#ffffff"/>
<text x="40" y="34" font-size="26" font-weight="bold" fill="#1a1a1a">Trust boundary: host and per-check container</text><rect x="40" y="56" width="340" height="448" rx="10" fill="none" stroke="#1a1a1a" stroke-width="3"/><text x="60" y="88" font-size="22" font-weight="bold" fill="#1a1a1a">Trusted host</text><rect x="580" y="56" width="340" height="448" rx="10" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="10 6"/><text x="600" y="88" font-size="22" font-weight="bold" fill="#1a1a1a">Per-check container</text><rect x="60" y="110" width="300" height="80" rx="8" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Launcher</text><text x="210" y="174" font-size="20" text-anchor="middle" fill="#4d4d4d">one container per check</text><rect x="60" y="210" width="300" height="80" rx="8" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="245" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Answers + scoring</text><text x="210" y="274" font-size="20" text-anchor="middle" fill="#4d4d4d">hidden, on the host</text><rect x="60" y="310" width="300" height="80" rx="8" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="3"/><text x="210" y="345" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Key + ledger</text><text x="210" y="374" font-size="20" text-anchor="middle" fill="#4d4d4d">host process only</text><rect x="600" y="110" width="300" height="80" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="750" y="145" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Supervisor</text><text x="750" y="174" font-size="20" text-anchor="middle" fill="#4d4d4d">checks the signed report</text><rect x="600" y="210" width="300" height="80" rx="8" fill="#eef3fa" stroke="#1f4e8c" stroke-width="3"/><text x="750" y="245" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Candidate function</text><text x="750" y="274" font-size="20" text-anchor="middle" fill="#4d4d4d">plus one case's input</text><rect x="600" y="330" width="300" height="154" rx="8" fill="#fdece3" stroke="#a33f00" stroke-width="3" stroke-dasharray="8 6"/><text x="750" y="362" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Never inside</text><text x="750" y="394" font-size="20" text-anchor="middle" fill="#1a1a1a">answers, credentials</text><text x="750" y="424" font-size="20" text-anchor="middle" fill="#1a1a1a">repository files, network</text><text x="750" y="454" font-size="20" text-anchor="middle" fill="#1a1a1a">MLflow, Podman control</text><path d="M360 124H584" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M598 124L584 117L584 131Z" fill="#1a1a1a" stroke="none"/><text x="480" y="114" font-size="20" text-anchor="middle" fill="#1a1a1a">code + one case</text><path d="M600 160H376" stroke="#1a1a1a" stroke-width="3" fill="none"/><path d="M362 160L376 153L376 167Z" fill="#1a1a1a" stroke="none"/><text x="480" y="188" font-size="20" text-anchor="middle" fill="#1a1a1a">bounded result</text>
</svg>
