# Explicit, ordered source list for the local HTML work log (scripts/build_work_log.py).
#
# Only the files named here are read. Nothing is harvested from neighbouring files,
# followed from links, or discovered recursively. Paths are repository-relative
# Markdown files; missing, absolute, escaping, symlinked, or private-looking paths
# fail the build.
#
# Section keys:
#   id      unique lowercase anchor (letters, digits, single hyphens)
#   title   heading shown in the report
#   kind    "document" (default; needs path and label) or "pending"
#   label   document provenance: current | historical | personal | reviewed
#   status  optional: implemented | planned | incomplete
#   needs   pending only: OpenSpec changes whose reviewed record fills the section
#   description  pending only: what the section will contain
#
# To fill a pending section after a milestone, replace its entry with a
# kind = "document" entry (same id, label "reviewed") that names the reviewed
# Markdown summary. Rebuild afterwards. A document that is only partly done (the demo
# path, whose comparison part awaits real runs) is registered with label "current" and
# status "incomplete" until its last placeholder is filled; then it becomes "reviewed".

[architecture]
diagram = "docs/work_log_architecture.svg"
explanation = "docs/work_log_architecture.md"

# Editable draw.io diagrams (docs/*.drawio.svg) with Markdown text twins. They are rebuilt
# through an allowlist sanitizer, separate from the check on the figure above.
[[diagram]]
id = "architecture-logical"
title = "Logical architecture: components and data flow"
svg = "docs/architecture_logical.drawio.svg"
text = "docs/architecture_logical.md"
description = "Components named by their modules under src/codegen_eval and scripts, with data flow, trust boundary, and status; the text equivalent below lists every box and arrow."
label = "current"

[[diagram]]
id = "architecture-physical"
title = "Physical architecture: deployment, trust boundaries, and phase 2"
svg = "docs/architecture_physical.drawio.svg"
text = "docs/architecture_physical.md"
description = "The local phase-1 system and the phase-2 external subsystems (OpenRouter, GitHub Actions, image registries) with trust boundaries; the text equivalent below lists every element."
label = "current"

[[diagram]]
id = "run-flow-activity"
title = "Experiment lifecycle: activity diagram with the run as a sub-activity"
svg = "docs/run_flow_activity.drawio.svg"
text = "docs/run_flow_activity.md"
description = "The whole experiment from start to finish with swimlanes, the expanded run command, and every way a run or command ends; the text equivalent below lists every node, flow, and ending."
label = "current"

[[diagram]]
id = "run-flow-sequence"
title = "One trial: sequence diagram"
svg = "docs/run_flow_sequence.drawio.svg"
text = "docs/run_flow_sequence.md"
description = "The exact call order of one trial between the real modules, with loop and alt fragments and the trust boundary; the text equivalent below lists every participant and message."
label = "current"

