<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Goal architecture of the agent evaluation and MLOps project</title>
  <desc id="arch-desc">A bounded coding agent calls an external model and runs agent-authored development checks in fresh Podman containers. An explicit final submission passes source validation and separate hidden acceptance grading, whose expected answers and scoring stay outside candidate containers. Results go to local run bundles, which feed grading replay and a local MLflow service. Comparison results, deterministic CI evidence and reviewed Markdown summaries feed the local report. Boxes with a solid outline are implemented; boxes with a dashed outline are planned.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arch-head"/>
    </marker>
  </defs>
  <style>
    .arch-bg { fill: #ffffff; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; fill: #111827; }
    .arch-box rect { stroke: #1f2937; stroke-width: 2; fill: #ffffff; }
    .arch-impl rect { fill: #e0efff; stroke-width: 4; }
    .arch-plan rect { stroke-dasharray: 8 5; }
    .arch-st { font-weight: 700; font-size: 12px; letter-spacing: 0.05em; }
    .arch-bound { fill: #fff4e5; stroke: #9a3412; stroke-width: 3; stroke-dasharray: 3 4; }
    .arch-bt { font-weight: 700; font-size: 12px; letter-spacing: 0.05em; fill: #9a3412; }
    .arch-note { font-size: 12px; fill: #374151; }
    .arch-edge { stroke: #374151; stroke-width: 2; fill: none; }
    .arch-head { fill: #374151; }
  </style>
  <rect class="arch-bg" x="0" y="0" width="960" height="790"/>

  <!-- Trust boundary around candidate execution -->
  <rect class="arch-bound" x="625" y="135" width="330" height="170" rx="10"/>
  <text class="arch-bt" x="640" y="153">TRUST BOUNDARY: CANDIDATE CODE ONLY</text>

  <!-- Row 1: inputs, agent, model -->
  <g class="arch-box arch-plan">
    <rect x="20" y="30" width="240" height="82" rx="8"/>
    <text x="32" y="52" class="arch-st">PLANNED</text>
    <text x="32" y="72">Task instruction + signature</text>
    <text x="32" y="90">and versioned prompt</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="300" y="30" width="300" height="82" rx="8"/>
    <text x="312" y="52" class="arch-st">PLANNED</text>
    <text x="312" y="72">Bounded coding agent</text>
    <text x="312" y="90">4 model calls, 3 tool attempts</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="640" y="30" width="300" height="82" rx="8"/>
    <text x="652" y="52" class="arch-st">PLANNED</text>
    <text x="652" y="72">Model via OpenRouter</text>
    <text x="652" y="90">external service, budget-limited</text>
  </g>
  <path class="arch-edge" d="M260,71 L300,71" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M600,71 L640,71" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Row 2: development checks and fresh container execution -->
  <g class="arch-box arch-plan">
    <rect x="300" y="170" width="300" height="82" rx="8"/>
    <text x="312" y="192" class="arch-st">PLANNED</text>
    <text x="312" y="212">run_checks: agent-authored</text>
    <text x="312" y="230">examples, up to 4 per request</text>
  </g>
  <g class="arch-box arch-impl">
    <rect x="640" y="163" width="300" height="130" rx="8"/>
    <text x="652" y="185" class="arch-st">IMPLEMENTED (PILOT)</text>
    <text x="652" y="205">Fresh Podman container per check</text>
    <text x="652" y="223">gets source + one case's arguments</text>
    <text x="652" y="241">no answers, scoring, credentials,</text>
    <text x="652" y="259">repository files, tracking, network,</text>
    <text x="652" y="277">or Podman controls</text>
  </g>
  <path class="arch-edge" d="M450,112 L450,170" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="arch-note" x="462" y="146">checks / feedback</text>
  <path class="arch-edge" d="M600,228 L640,228" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Row 3: final validation, hidden grading, bundles -->
  <g class="arch-box arch-impl">
    <rect x="20" y="330" width="240" height="82" rx="8"/>
    <text x="32" y="352" class="arch-st">IMPLEMENTED</text>
    <text x="32" y="372">Final source validation</text>
    <text x="32" y="390">strict one-function contract</text>
  </g>
  <g class="arch-box arch-impl">
    <rect x="300" y="330" width="300" height="100" rx="8"/>
    <text x="312" y="352" class="arch-st">IMPLEMENTED (PILOT)</text>
    <text x="312" y="372">Hidden acceptance grading</text>
    <text x="312" y="390">expected answers + scoring stay</text>
    <text x="312" y="408">outside candidate containers</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="640" y="330" width="300" height="82" rx="8"/>
    <text x="652" y="352" class="arch-st">PLANNED</text>
    <text x="652" y="372">Durable local run bundles</text>
    <text x="652" y="390">traces, results, saved candidates</text>
  </g>
  <path class="arch-edge" d="M300,85 L280,85 L280,300 L140,300 L140,330" marker-end="url(#arrow)"/>
  <text class="arch-note" x="272" y="200" text-anchor="end">explicit final</text>
  <text class="arch-note" x="272" y="216" text-anchor="end">submission</text>
  <path class="arch-edge" d="M260,371 L300,371" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M600,371 L640,371" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M540,330 L680,306" marker-end="url(#arrow)"/>
  <text class="arch-note" x="535" y="322" text-anchor="end">runs one case per container</text>

  <!-- Row 4: CI, replay, MLflow -->
  <g class="arch-box arch-plan">
    <rect x="20" y="460" width="240" height="82" rx="8"/>
    <text x="32" y="482" class="arch-st">PLANNED</text>
    <text x="32" y="502">Deterministic CI</text>
    <text x="32" y="520">fixtures and probes only</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="300" y="460" width="300" height="82" rx="8"/>
    <text x="312" y="482" class="arch-st">PLANNED</text>
    <text x="312" y="502">Grading replay of saved candidates</text>
    <text x="312" y="520">no generation, still uses Podman</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="640" y="460" width="300" height="82" rx="8"/>
    <text x="652" y="482" class="arch-st">PLANNED</text>
    <text x="652" y="502">Containerized local MLflow</text>
    <text x="652" y="520">recorded after local bundles</text>
  </g>
  <path class="arch-edge" d="M790,412 L790,460" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M690,412 L690,445 L620,445 L620,501 L600,501" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M450,460 L450,430" marker-end="url(#arrow)"/>
  <text class="arch-note" x="462" y="454">regrade, no generation</text>

  <!-- Row 5: report path -->
  <g class="arch-box arch-impl">
    <rect x="20" y="590" width="240" height="82" rx="8"/>
    <text x="32" y="612" class="arch-st">IMPLEMENTED</text>
    <text x="32" y="632">report/index.html</text>
    <text x="32" y="650">built from selected Markdown</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="300" y="590" width="300" height="82" rx="8"/>
    <text x="312" y="612" class="arch-st">PLANNED</text>
    <text x="312" y="632">Reviewed Markdown summaries</text>
    <text x="312" y="650">results, evidence IDs, limitations</text>
  </g>
  <g class="arch-box arch-plan">
    <rect x="640" y="590" width="300" height="82" rx="8"/>
    <text x="652" y="612" class="arch-st">PLANNED</text>
    <text x="652" y="632">Baseline vs revised comparison</text>
    <text x="652" y="650">same benchmark, 3 trials per task</text>
  </g>
  <path class="arch-edge" d="M790,542 L790,590" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M640,631 L600,631" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M300,631 L260,631" marker-end="url(#arrow)"/>
  <path class="arch-edge" d="M140,542 L140,566 L330,566 L330,590" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g class="arch-box arch-impl">
    <rect x="20" y="700" width="60" height="28" rx="5"/>
  </g>
  <text x="92" y="719">Implemented now (offline pilot or this report builder)</text>
  <g class="arch-box arch-plan">
    <rect x="500" y="700" width="60" height="28" rx="5"/>
  </g>
  <text x="572" y="719">Planned, not yet implemented (dashed)</text>
  <rect class="arch-bound" x="20" y="740" width="60" height="28" rx="5"/>
  <text x="92" y="759">Trust boundary: only candidate code runs inside; answers, scoring, credentials, tracking stay outside</text>
</svg>
