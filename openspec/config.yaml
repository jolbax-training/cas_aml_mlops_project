schema: spec-driven

context: |
  Follow docs/project_spec.md as the authoritative scope and docs/progress.md for evidence.
  The user-confirmed 2026-10-23 plan has four eight-hour working days (32 hours).
  Goals are transferable understanding of agent evaluations and a reproducible MLOps workflow.
  Implement a function-writing agent with optional agent-authored development checks:
  at most four logical model calls, three tool attempts, four checks per tool request,
  and a final-only fourth model call. Grade the final submission on hidden acceptance checks.
  Use a trusted host CLI with uv, fresh restricted Podman containers per check, and
  containerized local MLflow with persistent data and agent/model/tool traces.
  Keep expected answers, scoring, secrets, repository mounts, and Podman controls outside
  candidate execution. Verify isolation and scoring integrity before live comparisons.
  The target execution deadline is ten seconds per check; the pilot still defaults to eight.
  Freeze ten independently reviewed tasks across five categories, four cases per task.
  Compare baseline and revised prompts with three trials per task: sixty task trials total.
  Use OpenRouter z-ai/glm-5.3-flash on fixed open-inference/fp4 routing, subject to smoke checks;
  temperature 0.2, top-p 1, low reasoning effort, 12k input/2k output tokens, 60s API attempts.
  Retry only transient transport failures: one per request, at most two per trial.
  All paid calls share a ledger: CHF 10 checkpoint continues; CHF 15 reserved-cost ceiling stops.
  Persist local bundles before tracking; support service-free inspection, Podman grading replay,
  and API-free interaction fixtures. Establish the local path before CI/MLflow integration.
  Required evidence includes deterministic CI and complete local/MLflow comparison records.
  Keep the simplified offline HTML work-log, with first foundation on day two and no hosting.
  Deliver a reusable eval-design guide and a design-only research coordinator example:
  one worker and independent verifier per item, followed by a final cross-item check.
  Reflections support learning without blocking delivery. Never invent personal reflections.
  No second implemented orchestrator, extra tracking platform, paid CI, DVC, or Deepchecks is required.

rules:
  proposal:
    - Identify the current milestone and dependencies; keep optional work separate.
    - State completion evidence and fit within the 32-hour scope; distinguish plans from results.
  design:
    - Keep credentials, hidden expected answers, and scoring outside candidate execution.
    - Preserve local evidence, replay, and budget reservations through API/tracking failures.
  tasks:
    - Include appropriate verification and updates to editable status/report sources.
    - Keep planned work distinct from implemented or verified behavior.
