# Deterministic CI: fixtures only. No secrets, no model API, no paid calls.
# Two independent check groups (job ids/names are the required-check names):
#   offline - locked uv environment, tests, OpenSpec, benchmark freeze, work-log check
#   podman  - real restricted Podman containers against the digest-pinned image
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.9.3"
  PYTHON_VERSION: "3.12"

jobs:
  offline:
    name: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions pinned to commit SHAs (checkout v4.2.2, setup-uv v6.8.0, setup-node v4.4.0)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install locked dependencies (including the optional MLflow client group)
        run: uv sync --python "$PYTHON_VERSION" --locked --group tracking
      - name: Tests (Podman-dependent tests skip here by design; the podman job runs them)
        env:
          CODEGEN_EVAL_REQUIRE_TRACKING: "1"  # the MLflow unit tests must run, not skip
        run: .venv/bin/pytest -q -rfE --tb=short --junitxml="$RUNNER_TEMP/offline-junit.xml"
      - name: Annotate failed tests (readable without job logs)
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python scripts/ci_annotate_junit.py "$RUNNER_TEMP/offline-junit.xml"
          echo "::notice title=Runner environment::$(.venv/bin/python -V); $(git --version); podman=$(command -v podman || echo none); cpus=$(nproc); user=$(id -un)"
      - name: Install OpenSpec CLI (npm ci from the committed lockfile)
        run: npm ci --ignore-scripts --prefix .github/openspec
      - name: Validate main specs and in-flight changes that carry specs (strict)
        run: scripts/ci_validate_openspec.sh .github/openspec/node_modules/.bin/openspec
      - name: Benchmark freeze check
        run: .venv/bin/python scripts/freeze_benchmark.py --check
      - name: Work-log sources check
        run: .venv/bin/python scripts/build_work_log.py --check

  podman:
    name: podman
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # synthetic value the isolation probes must never see inside a candidate container
      CODEGEN_EVAL_TEST_SECRET: present
      RUN_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --python "$PYTHON_VERSION" --locked
      - name: Install Podman (run as root; see README)
        # Rootless Podman on a hosted runner has no logind user session, so it cannot create
        # a delegated cgroup and would not enforce memory/pids/cpu limits. Podman therefore
        # runs rootful: every Podman-using step runs as root (passwordless sudo on the
        # runner), as the laptop's rootful VM does. A sudo shim for `podman` is not used:
        # the sandbox kills a timed-out `podman run` client, and an unprivileged process
        # cannot signal a root-owned sudo.
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version
      - name: Pull the pinned candidate image by digest (retries, mirror, digest check)
        env:
          CI_IMAGE_MIRROR: public.ecr.aws/docker/library
        run: sudo -E env "PATH=$PATH" scripts/ci_pull_pinned_image.sh
      - name: Verify Podman can enforce memory, pids, and cpu limits
        run: sudo -E env "PATH=$PATH" scripts/ci_verify_podman_limits.sh
      - name: Ensure processes in a restricted container can signal each other
        run: sudo -E env "PATH=$PATH" scripts/ci_ensure_container_signals.sh
      - name: Sandbox tests (a skip is a failure)
        run: |
          sudo -E env "PATH=$PATH" .venv/bin/pytest -q -m "sandbox and not mlflow_service" -rs --tb=short \
            --junitxml="$RUNNER_TEMP/sandbox-junit.xml"
      - name: Annotate failed tests (readable without job logs)
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python scripts/ci_annotate_junit.py "$RUNNER_TEMP/sandbox-junit.xml"
          echo "::notice title=Leftover containers::$(sudo podman ps -a --format '{{.Names}}' | wc -l) container(s) left after the sandbox tests"
      - name: Fail on skipped, errored, or missing Podman tests
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/ci_require_no_skips.py "$RUNNER_TEMP/sandbox-junit.xml"
